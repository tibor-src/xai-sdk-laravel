name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.56', '12.69', '13.32']
        pest: ['3.8', '4.7']
        exclude:
          - php: '8.2'
            pest: '4.7'
          - php: '8.2'
            laravel: '13.32'
          - php: '8.3'
            pest: '3.8'
          - php: '8.4'
            pest: '3.8'
          - php: '8.5'
            pest: '3.8'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-pest-${{ matrix.pest }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-pest-${{ matrix.pest }}-composer-

      - name: Set dependencies
        run: |
          case "${{ matrix.laravel }}" in
            11.*) testbench="^9.12" ;;
            12.*) testbench="^10.8" ;;
            13.*) testbench="^11.3" ;;
          esac
          composer require "laravel/framework:^${{ matrix.laravel }}" "orchestra/testbench:${testbench}" --dev --no-interaction --no-update
          composer require "pestphp/pest:^${{ matrix.pest }}" --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --prefer-dist --no-progress --ansi

      - name: Run unit tests
        run: composer test:unit

      - name: Run type coverage
        if: matrix.pest == '4.7'
        run: composer test:type-coverage
